[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "django>=5.2.8,<6",
    "django-anymail[mailgun]>=15.2",
    "django-filter>=25.1",
    "django-redis>=6.0.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.22.1",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "redis[hiredis]>=6.2.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "model-bakery>=1.20.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "pytest-django>=4.11.1",
    "pytest-sugar>=1.0.0",
    "ruff>=0.17.0",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "DJ"]
# ruff format owns line length.
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db --nomigrations -p no:warnings"
